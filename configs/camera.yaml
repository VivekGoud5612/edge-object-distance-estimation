# Camera + object assumptions for geometric distance estimation.
#
# EVERY number here is an assumption or a calibration result. The distance
# code never hard-codes any of them. Change a value, rerun, and you have a
# sensitivity analysis.

active_camera: bdd100k

cameras:
  # BDD100K: crowd-sourced phone dashcams, 1280x720. The dataset does NOT
  # publish per-video intrinsics, so we assume a typical phone horizontal FOV
  # of ~65 deg:  f = (W/2) / tan(HFOV/2) = 640 / tan(32.5 deg) ~ 1005 px.
  bdd100k:
    image_size: [1280, 720]
    hfov_deg: 65.0
    mount_height_m: 1.30        # typical windshield-mounted phone
    pitch_deg: 0.0              # assume level camera -> horizon at the image centre row
    focal_rel_uncertainty: 0.10 # unknown camera, so +/-10 % on f

  # ROADWork 1080p dash-cams, FITTED from the labels by
  # scripts/distance_analysis.py (docs/FINDINGS.md): box height vs bottom row
  # gives H/h_cam = 0.275 and the horizon at 50.5 % of the image height
  # (level camera). With the 0.70 m cone prior that means h_cam = 0.70/0.275
  # = 2.54 m, so the pinhole and ground-plane estimates agree on average
  # (with bdd100k values they disagree by ~2x). Caveat: the 1080p set pools
  # 18 city fleets (horizons 44-64 %), so this is an average camera, and the
  # focal length is still the 65 deg assumption (f = 960/tan(32.5) = 1507 px).
  roadwork_1080p:
    image_size: [1920, 1080]
    hfov_deg: 65.0
    mount_height_m: 2.54
    pitch_deg: 0.0
    focal_rel_uncertainty: 0.10

  # Your own camera after running:  python -m scripts.calibrate_camera ...
  # Paste the printed fx/fy/cx/cy here. Calibrated f is good to ~1-2 %.
  my_camera:
    image_size: [1280, 720]
    fx: 1000.0                  # placeholder: replace with calibration output
    fy: 1000.0
    cx: 640.0
    cy: 360.0
    mount_height_m: 0.50        # measure with a tape for your setup
    pitch_deg: 0.0
    focal_rel_uncertainty: 0.02

# Real-world heights of the *visible box*. Use height (not width) because it
# barely changes as the object rotates.
objects:
  cone:
    height_m: 0.70              # common 28" road cone; small cones are 0.45 m, tall 0.91 m
    height_rel_uncertainty: 0.40  # MEASURED on ROADWork: robust log scatter 0.38-0.46 (docs/FINDINGS.md); was 0.25
    on_ground: true
  barrier:
    height_m: 0.80              # Jersey barrier ~0.81 m; plastic barricades ~1.0 m; drums ~0.9 m (v2 data)
    height_rel_uncertainty: 0.40  # measured log scatter ~0.44-0.57 for ROADWork barriers+drums; was 0.25
    on_ground: true
  stop_sign:
    height_m: 0.75              # standard 30" octagon plate (the box covers the plate, not the pole)
    height_rel_uncertainty: 0.15
    on_ground: false            # mounted on a pole, so the ground-plane method does not apply

distance:
  method: pinhole               # pinhole | ground | fused
  min_box_px: 10                # shorter boxes -> flagged "tiny" (1 px error = >10 % error)
  border_margin_px: 2           # boxes touching the border -> flagged "truncated"
  min_distance_m: 0.3
  max_distance_m: 150.0
  fuse_max_disagreement: 0.30   # fused: average the two only if they agree within 30 %
